<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览 tangyixiao 的 OI / ACM 竞赛代码与题解归档。">
  <meta name="theme-color" content="#08111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://raw.githubusercontent.com; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; base-uri 'none'; form-action 'none'">
  <title>CodeHub · 竞赛代码归档</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308111f'/%3E%3Cpath d='m25 18-13 14 13 14M39 18l13 14-13 14' fill='none' stroke='%2357d3e8' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #08111f;
      --panel: #0f1b2d;
      --panel-raised: #142238;
      --rail: #253752;
      --text: #e7eef8;
      --muted: #91a5bf;
      --cpp: #57d3e8;
      --md: #f4c76b;
      --danger: #ff7b72;
      --shadow: 0 18px 48px #02071180;
      --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      --mono: Consolas, "Cascadia Code", "SFMono-Regular", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
      background: radial-gradient(circle at 16% -20%, #17345a 0, transparent 34rem), var(--ink);
      font-family: var(--sans);
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--cpp);
      outline-offset: 2px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .skip-link { position: fixed; top: 8px; left: 8px; z-index: 100; padding: 8px 12px; border-radius: 8px; color: var(--ink); background: var(--cpp); transform: translateY(-160%); }
    .skip-link:focus { transform: translateY(0); }
    .site-header {
      flex: none;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--rail);
      background: #0a1525e8;
      backdrop-filter: blur(18px);
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; color: inherit; text-decoration: none; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #57d3e866; border-radius: 11px; color: var(--cpp); background: #57d3e80d; font: 700 17px/1 var(--mono); box-shadow: inset 0 0 18px #57d3e812; }
    .brand-copy { min-width: 0; }
    .brand-title { display: block; font-weight: 760; letter-spacing: .01em; }
    .brand-subtitle { display: block; margin-top: 2px; color: var(--muted); font: 11px/1.2 var(--mono); white-space: nowrap; }
    .header-status { margin-left: auto; max-width: 34vw; color: var(--muted); font: 12px/1.4 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions, .reader-actions { display: flex; align-items: center; gap: 8px; }
    .btn { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--rail); border-radius: 9px; color: var(--text); background: #142238cc; cursor: pointer; text-decoration: none; font-size: 13px; white-space: nowrap; }
    .btn:hover { border-color: #496484; background: #1a2b44; }
    .btn-accent { border-color: #57d3e866; color: var(--cpp); }
    .app-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); }
    .file-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--rail); background: #0d192ae8; }
    .panel-tools { flex: none; padding: 16px 14px 13px; border-bottom: 1px solid var(--rail); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 12px; color: var(--muted); transform: translateY(-50%); pointer-events: none; font: 14px/1 var(--mono); }
    #search { width: 100%; height: 40px; padding: 0 36px; border: 1px solid var(--rail); border-radius: 10px; color: var(--text); background: #081321; outline: none; }
    #search::placeholder { color: #7186a0; }
    #search:focus { border-color: var(--cpp); box-shadow: 0 0 0 3px #57d3e819; }
    #clear-search { position: absolute; top: 50%; right: 7px; width: 28px; height: 28px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; transform: translateY(-50%); }
    #clear-search:hover { color: var(--text); background: #ffffff0b; }
    .filter-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
    .filter-btn { height: 34px; border: 1px solid transparent; border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; }
    .filter-btn:hover { color: var(--text); background: #ffffff0a; }
    .filter-btn[aria-pressed="true"] { border-color: var(--rail); color: var(--text); background: var(--panel-raised); }
    .filter-btn[data-filter="cpp"][aria-pressed="true"] { color: var(--cpp); }
    .filter-btn[data-filter="md"][aria-pressed="true"] { color: var(--md); }
    .list-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--muted); font: 11px/1.3 var(--mono); }
    .sort-label { display: flex; align-items: center; gap: 6px; }
    #sort { max-width: 92px; padding: 4px 6px; border: 1px solid var(--rail); border-radius: 7px; color: var(--text); background: var(--panel); font-size: 11px; }
    .file-list { flex: 1; min-height: 0; overflow: auto; padding: 7px; scrollbar-color: #324866 transparent; }
    .file-row { position: relative; width: 100%; min-height: 42px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 9px; border: 1px solid transparent; border-radius: 8px; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
    .file-row:hover { background: #ffffff08; }
    .file-row[aria-current="true"] { border-color: #57d3e833; background: #57d3e80c; }
    .file-row[aria-current="true"]::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: -1px; width: 2px; border-radius: 2px; background: var(--cpp); }
    .kind { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 22px; border: 1px solid currentColor; border-radius: 999px; font: 700 10px/1 var(--mono); }
    .kind-cpp { color: var(--cpp); background: #57d3e80b; }
    .kind-md { color: var(--md); background: #f4c76b0b; }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px/1.35 var(--mono); }
    .file-size { color: #7186a0; font: 10px/1 var(--mono); }
    .empty-state { padding: 34px 18px; color: var(--muted); text-align: center; line-height: 1.7; }
    .reader { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .reader-bar { flex: none; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--rail); background: #0d192abf; }
    .back-btn { display: none; }
    .file-meta { min-width: 0; flex: 1; }
    #meta-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 650 13px/1.3 var(--mono); }
    #meta-sub { margin-top: 3px; color: var(--muted); font: 10px/1.3 var(--mono); }
    .pair-button { position: relative; padding-left: 24px; }
    .pair-button::before { content: ""; position: absolute; left: 10px; width: 7px; height: 15px; border-left: 2px solid var(--cpp); border-bottom: 2px solid var(--md); border-radius: 0 0 0 4px; }
    .viewer-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-color: #324866 transparent; }
    .welcome { min-height: 100%; display: grid; place-items: center; padding: 36px; }
    .welcome-card { width: min(620px, 100%); padding: clamp(24px, 5vw, 52px); border: 1px solid var(--rail); border-radius: 20px; background: linear-gradient(145deg, #142238c7, #0d192aa6); box-shadow: var(--shadow); }
    .welcome-kicker { color: var(--cpp); font: 700 11px/1.3 var(--mono); letter-spacing: .14em; }
    .welcome h1 { max-width: 12ch; margin: 14px 0; font-size: clamp(30px, 5vw, 58px); line-height: .98; letter-spacing: -.04em; }
    .welcome p { max-width: 48ch; margin: 0; color: var(--muted); line-height: 1.8; }
    .loading, .error-box { margin: 32px; padding: 18px 20px; border: 1px solid var(--rail); border-radius: 12px; color: var(--muted); background: var(--panel); line-height: 1.7; }
    .error-box { border-color: #ff7b7255; color: #ffc1bd; }
    .code-view { min-width: max-content; display: grid; grid-template-columns: auto minmax(0, 1fr); padding: 18px 0 42px; }
    .line-numbers { padding: 16px 14px 16px 20px; border-right: 1px solid var(--rail); color: #5f7591; background: #07101c; text-align: right; user-select: none; font: 13px/1.68 var(--mono); }
    .line-numbers span { display: block; }
    .code-block { margin: 0; padding: 16px 24px; background: transparent !important; overflow: visible; }
    .code-block code { font: 13px/1.68 var(--mono); tab-size: 4; }
    .markdown-body { max-width: 920px; margin: 0 auto; padding: 34px clamp(22px, 5vw, 64px) 72px; color: var(--text); background: transparent; }
    .markdown-body pre { border: 1px solid var(--rail); background: #07101c !important; }
    .markdown-fallback { margin: 0; padding: 30px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.7 var(--mono); }
    .site-footer { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 5px 14px; border-top: 1px solid var(--rail); color: #7186a0; background: #07101c; font: 10px/1.3 var(--mono); }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .toast { position: fixed; left: 50%; bottom: 44px; z-index: 30; max-width: min(480px, 86vw); padding: 10px 15px; border: 1px solid var(--rail); border-radius: 10px; color: var(--text); background: #142238; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .18s ease, transform .18s ease; font-size: 13px; }
    .toast[data-visible="true"] { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 310px minmax(0, 1fr); }
      .brand-subtitle, .header-status, .header-actions .home-link { display: none; }
      .reader-actions .btn-label { display: none; }
    }
    @media (max-width: 780px) {
      body { overflow: hidden; }
      .site-header { min-height: 56px; padding: 8px 12px; }
      .brand-mark { width: 34px; height: 34px; }
      .header-actions .btn { min-height: 32px; padding: 5px 9px; }
      .app-shell { display: block; }
      .file-panel, .reader { width: 100%; height: 100%; border-right: 0; }
      body[data-mobile-view="list"] .file-panel { display: flex; }
      body[data-mobile-view="list"] .reader { display: none; }
      body[data-mobile-view="viewer"] .file-panel { display: none; }
      body[data-mobile-view="viewer"] .reader { display: flex; }
      .back-btn { display: inline-flex; }
      .reader-bar { padding: 8px 10px; }
      .reader-actions { gap: 5px; }
      .reader-actions .btn { min-width: 34px; padding: 5px 8px; }
      .site-footer { display: none; }
      .welcome { padding: 20px; }
      .welcome-card { border-radius: 16px; }
      .loading, .error-box { margin: 18px; }
      .markdown-body { padding: 24px 18px 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body data-mobile-view="list">
  <a class="skip-link" href="#file-list">跳到文件列表</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="CodeHub 首页">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span class="brand-copy"><span class="brand-title">CodeHub</span><span class="brand-subtitle">tangyixiao / competitive programming</span></span>
    </a>
    <span class="header-status" id="status" role="status" aria-live="polite">正在读取代码清单…</span>
    <nav class="header-actions" aria-label="站点链接">
      <a class="btn home-link" href="/">个人主页</a>
      <a class="btn btn-accent" href="https://github.com/tangyixiao/Code" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
  </header>
  <div class="app-shell">
    <aside class="file-panel" aria-label="代码文件">
      <div class="panel-tools">
        <div class="search-wrap">
          <label class="sr-only" for="search">搜索题目编号或文件名</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="搜索题目编号或文件名" autocomplete="off" spellcheck="false">
          <button id="clear-search" type="button" aria-label="清空搜索" title="清空搜索">×</button>
        </div>
        <div class="filter-row" aria-label="文件类型筛选">
          <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-btn" type="button" data-filter="cpp" aria-pressed="false">C++</button>
          <button class="filter-btn" type="button" data-filter="md" aria-pressed="false">Markdown</button>
        </div>
        <div class="list-meta">
          <span id="count-text">正在加载…</span>
          <label class="sort-label" for="sort">排序
            <select id="sort"><option value="name">名称</option><option value="size">大小</option></select>
          </label>
        </div>
      </div>
      <div class="file-list" id="file-list" tabindex="-1"><div class="empty-state">正在准备完整文件索引…</div></div>
    </aside>
    <main class="reader" id="reader">
      <div class="reader-bar">
        <button class="btn back-btn" id="back-to-list" type="button" aria-label="返回文件列表">←</button>
        <div class="file-meta"><div id="meta-name">选择一个文件开始阅读</div><div id="meta-sub">代码与题解保持同一条阅读轨道</div></div>
        <div class="reader-actions">
          <button class="btn pair-button" id="paired-file" type="button" hidden><span class="btn-label">查看配对文件</span></button>
          <button class="btn" id="copy-file" type="button" title="复制文件内容">复制</button>
          <a class="btn" id="raw-file" href="https://github.com/tangyixiao/Code" target="_blank" rel="noopener noreferrer"><span class="btn-label">原文</span> ↗</a>
        </div>
      </div>
      <div class="viewer-scroll" id="viewer" tabindex="-1">
        <section class="welcome"><div class="welcome-card"><div class="welcome-kicker">ALGORITHM ARCHIVE</div><h1>代码和思路，在同一条轨道。</h1><p>从左侧搜索题号或标题。C++ 实现与同名 Markdown 题解会自动配对，选择后即可阅读、复制或分享当前链接。</p></div></section>
      </div>
    </main>
  </div>
  <footer class="site-footer"><span id="build-info">索引尚未加载</span><a href="https://github.com/tangyixiao/Code" target="_blank" rel="noopener noreferrer">source: tangyixiao/Code</a></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js"></script>
  <script>
    'use strict';
    const CONFIG = Object.freeze({ owner: 'tangyixiao', repo: 'Code' });
    const state = { manifest: null, files: [], fileByPath: new Map(), filter: 'all', query: '', sort: 'name', selected: null, currentText: '', requestId: 0 };
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];
    function escapeHtml(value) { return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function formatSize(bytes) { if (bytes < 1024) return `${bytes} B`; if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`; return `${(bytes / 1024 / 1024).toFixed(2)} MB`; }
    function naturalCompare(left, right) { return left.localeCompare(right, 'zh-CN', { numeric: true, sensitivity: 'base' }); }
    function encodePath(path) { return path.split('/').map((part) => encodeURIComponent(part)).join('/'); }
    function rawUrl(file) { return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${state.manifest.commit}/${encodePath(file.path)}`; }
    function validateManifest(value) {
      if (!value || value.schemaVersion !== 1) throw new Error('文件索引版本不受支持');
      if (!/^[0-9a-f]{40}$/i.test(value.commit || '')) throw new Error('文件索引缺少有效提交版本');
      if (!Array.isArray(value.files) || value.files.length === 0) throw new Error('文件索引为空');
      if (value.count !== value.files.length) throw new Error('文件索引数量不一致');
      const seen = new Set();
      for (const file of value.files) {
        const validType = file && (file.type === 'cpp' || file.type === 'md');
        const expectedType = typeof file?.path === 'string' ? file.path.split('.').pop().toLowerCase() : '';
        if (!validType || file.type !== expectedType || file.name !== file.path || /[\\/]/.test(file.path) || !Number.isInteger(file.size) || file.size < 0) throw new Error('文件索引包含无效条目');
        if (seen.has(file.path)) throw new Error('文件索引包含重复路径');
        seen.add(file.path);
      }
      return value;
    }
    function setStatus(message) { $('#status').textContent = message; }
    let toastTimer;
    function toast(message) { const element = $('#toast'); element.textContent = message; element.dataset.visible = 'true'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { element.dataset.visible = 'false'; }, 2200); }
    function filteredFiles() {
      const query = state.query.toLocaleLowerCase('zh-CN');
      const files = state.files.filter((file) => { if (state.filter !== 'all' && file.type !== state.filter) return false; return !query || file.name.toLocaleLowerCase('zh-CN').includes(query); });
      return [...files].sort((left, right) => state.sort === 'size' ? left.size - right.size || naturalCompare(left.name, right.name) : naturalCompare(left.name, right.name));
    }
    function renderList() {
      const visible = filteredFiles();
      $('#count-text').textContent = `显示 ${visible.length} / ${state.files.length} 个文件`;
      const list = $('#file-list');
      if (!visible.length) { list.innerHTML = '<div class="empty-state">没有匹配的文件。换一个题号、标题或文件类型试试。</div>'; return; }
      list.innerHTML = visible.map((file) => {
        const typeName = file.type === 'cpp' ? 'C++' : 'Markdown';
        return `<button class="file-row" type="button" data-path="${escapeHtml(file.path)}" aria-label="${typeName} ${escapeHtml(file.name)}" aria-current="${file.path === state.selected}"><span class="kind kind-${file.type}" aria-hidden="true">${file.type === 'cpp' ? 'C++' : 'MD'}</span><span class="file-name">${escapeHtml(file.name)}</span><span class="file-size">${formatSize(file.size)}</span></button>`;
      }).join('');
    }
    function pairedPath(path) { const base = path.replace(/\.(cpp|md)$/i, ''); const pair = `${base}.${path.toLowerCase().endsWith('.cpp') ? 'md' : 'cpp'}`; return state.fileByPath.has(pair) ? pair : null; }
    function pathFromHash() { if (!location.hash.startsWith('#file=')) return null; try { return decodeURIComponent(location.hash.slice(6)); } catch { return null; } }
    function updateFileBar(file, lines) {
      $('#meta-name').textContent = file.name; $('#meta-name').title = file.name;
      $('#meta-sub').textContent = `${file.type === 'cpp' ? 'C++ 实现' : 'Markdown 题解'} · ${formatSize(file.size)}${lines == null ? '' : ` · ${lines} 行`}`;
      const pair = pairedPath(file.path); const pairButton = $('#paired-file'); pairButton.hidden = !pair; pairButton.dataset.path = pair || '';
      $('#raw-file').href = rawUrl(file);
    }
    function renderCode(text) {
      let highlighted = escapeHtml(text);
      if (window.hljs) { try { highlighted = window.hljs.highlight(text, { language: 'cpp', ignoreIllegals: true }).value; } catch {} }
      const normalized = text.replace(/\r\n/g, '\n').replace(/\n$/, ''); const lines = normalized ? normalized.split('\n').length : (text ? 1 : 0);
      const numbers = Array.from({ length: lines }, (_, index) => `<span>${index + 1}</span>`).join('');
      $('#viewer').innerHTML = `<div class="code-view"><div class="line-numbers" aria-hidden="true">${numbers}</div><pre class="code-block"><code class="language-cpp">${highlighted}</code></pre></div>`;
      return lines;
    }
    function renderMarkdown(text) {
      const viewer = $('#viewer');
      if (window.marked && window.DOMPurify) {
        try {
          const rendered = window.marked.parse(text);
          viewer.innerHTML = `<article class="markdown-body">${window.DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } })}</article>`;
          const article = viewer.querySelector('.markdown-body');
          if (window.renderMathInElement) {
            window.renderMathInElement(article, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true }
              ],
              throwOnError: false,
              strict: 'ignore',
              trust: false,
              macros: {
                '\\blue': '\\textcolor{blue}{#1}',
                '\\purple': '\\textcolor{purple}{#1}',
                '\\red': '\\textcolor{red}{#1}',
                '\\green': '\\textcolor{green}{#1}',
                '\\orange': '\\textcolor{orange}{#1}',
                '\\gray': '\\textcolor{gray}{#1}'
              }
            });
          }
          if (window.hljs) viewer.querySelectorAll('pre code').forEach((code) => window.hljs.highlightElement(code));
          return text.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n').length;
        } catch {}
      }
      viewer.innerHTML = `<pre class="markdown-fallback">${escapeHtml(text)}</pre>`;
      return text.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n').length;
    }
    async function openFile(path, options = {}) {
      const file = state.fileByPath.get(path); if (!file) return;
      const requestId = ++state.requestId; state.selected = path; state.currentText = ''; document.body.dataset.mobileView = 'viewer'; renderList(); updateFileBar(file, null);
      $('#viewer').innerHTML = `<div class="loading">正在读取 <strong>${escapeHtml(file.name)}</strong>…</div>`; setStatus(`正在读取 ${file.name}`);
      if (options.updateHash !== false) history.replaceState(null, '', `#file=${encodeURIComponent(path)}`);
      try {
        const response = await fetch(rawUrl(file), { cache: 'force-cache' }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const text = await response.text(); if (requestId !== state.requestId) return;
        state.currentText = text; const lines = file.type === 'cpp' ? renderCode(text) : renderMarkdown(text); updateFileBar(file, lines); setStatus(`已打开 ${file.name}`); $('#viewer').scrollTop = 0;
      } catch (error) { if (requestId !== state.requestId) return; $('#viewer').innerHTML = `<div class="error-box">无法读取此文件：${escapeHtml(error.message)}。<br>可以打开右上角“原文”重试，或稍后刷新页面。</div>`; setStatus(`读取失败：${file.name}`); }
    }
    async function loadManifest() {
      setStatus('正在读取代码清单…'); $('#count-text').textContent = '正在加载…';
      try {
        const response = await fetch('./files.json', { cache: 'no-cache' }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const manifest = validateManifest(await response.json());
        state.manifest = manifest; state.files = manifest.files; state.fileByPath = new Map(manifest.files.map((file) => [file.path, file])); renderList();
        const shortCommit = manifest.commit.slice(0, 7); setStatus(`${manifest.count} 个文件 · ${shortCommit}`); $('#build-info').textContent = `索引 ${shortCommit} · ${manifest.generatedAt}`;
        const requested = pathFromHash();
        if (requested && state.fileByPath.has(requested)) await openFile(requested, { updateHash: false });
        else if (requested) { toast('链接中的文件不在当前索引中'); history.replaceState(null, '', location.pathname + location.search); }
        else if (innerWidth > 780 && state.files.length) await openFile(state.files[0].path, { updateHash: false });
      } catch (error) {
        state.files = []; state.fileByPath = new Map(); $('#file-list').innerHTML = `<div class="empty-state">索引加载失败：${escapeHtml(error.message)}<br><button class="btn" id="retry-load" type="button">重新加载</button></div>`; $('#count-text').textContent = '加载失败'; setStatus('代码清单加载失败'); $('#retry-load')?.addEventListener('click', loadManifest);
      }
    }
    function fallbackCopy(text) { const area = document.createElement('textarea'); area.value = text; area.style.cssText = 'position:fixed;opacity:0;pointer-events:none'; document.body.append(area); area.select(); const copied = document.execCommand('copy'); area.remove(); return copied; }
    $('#file-list').addEventListener('click', (event) => { const button = event.target.closest('.file-row'); if (button) openFile(button.dataset.path); });
    $('#search').addEventListener('input', (event) => { state.query = event.target.value.trim(); renderList(); });
    $('#clear-search').addEventListener('click', () => { $('#search').value = ''; state.query = ''; renderList(); $('#search').focus(); });
    $('#sort').addEventListener('change', (event) => { state.sort = event.target.value; renderList(); });
    $$('.filter-btn').forEach((button) => button.addEventListener('click', () => { state.filter = button.dataset.filter; $$('.filter-btn').forEach((item) => item.setAttribute('aria-pressed', String(item === button))); renderList(); }));
    $('#paired-file').addEventListener('click', (event) => { if (event.currentTarget.dataset.path) openFile(event.currentTarget.dataset.path); });
    $('#back-to-list').addEventListener('click', () => { document.body.dataset.mobileView = 'list'; $('#search').focus(); });
    $('#copy-file').addEventListener('click', async () => { if (!state.currentText) { toast('请先打开一个文件'); return; } try { if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(state.currentText); else if (!fallbackCopy(state.currentText)) throw new Error('copy failed'); toast('文件内容已复制'); } catch { toast('复制失败，请在阅读区手动选择'); } });
    addEventListener('hashchange', () => { const path = pathFromHash(); if (path && path !== state.selected && state.fileByPath.has(path)) openFile(path, { updateHash: false }); });
    addEventListener('keydown', (event) => { if (event.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { event.preventDefault(); $('#search').focus(); } if (event.key === 'Escape' && innerWidth <= 780 && document.body.dataset.mobileView === 'viewer') { document.body.dataset.mobileView = 'list'; $('#search').focus(); } });
    loadManifest();
  </script>
